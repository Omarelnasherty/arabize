name: arabize_lints
description: Analyzer lints that catch left-to-right layout assumptions in Flutter code.
version: 0.0.1
repository: https://github.com/Omarelnasherty/arabize/tree/main/packages/arabize_lints
issue_tracker: https://github.com/Omarelnasherty/arabize/issues
topics:
  - arabic
  - rtl
  - localization
  - flutter

environment:
  sdk: ^3.10.0
resolution: workspace

dependencies:
  analysis_server_plugin: ">=0.3.4 <0.4.0"
  analyzer: ">=13.3.0 <15.0.0"
  analyzer_plugin: ">=0.14.0 <0.15.0"

dev_dependencies:
  analyzer_testing: ">=0.1.0 <0.5.0"
  test: ^1.25.0
  test_reflective_loader: ^0.4.0
